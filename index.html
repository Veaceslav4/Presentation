<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Земля (Fix Loading)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        /* Убрали надпись загрузки, так как планета появится сразу */
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

        // --- 1. СЦЕНА ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 8;
        controls.maxDistance = 30;

        // --- 2. СОЗДАЕМ БАЗОВУЮ ПЛАНЕТУ СРАЗУ ---
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        const geometry = new THREE.SphereGeometry(5, 64, 64);
        
        // Базовый материал (синий), пока текстуры не загрузятся
        const material = new THREE.MeshPhongMaterial({
            color: 0x1c4e91, // Красивый синий цвет
            emissive: 0x001133,
            specular: 0x111111,
            shininess: 10
        });

        const earthMesh = new THREE.Mesh(geometry, material);
        earthGroup.add(earthMesh);

        // --- 3. ЗАГРУЗКА ТЕКСТУР В ФОНЕ ---
        const textureLoader = new THREE.TextureLoader();
        // Важно: разрешаем кросс-доменную загрузку
        textureLoader.crossOrigin = 'anonymous';

        // Используем ссылки Wikimedia (обычно более стабильны для CORS)
        const mapUrl = 'https://upload.wikimedia.org/wikipedia/commons/c/c3/Solarsystemscope_texture_2k_earth_daymap.jpg';
        const specUrl = 'https://upload.wikimedia.org/wikipedia/commons/archive/4/4e/20120125152730%21Solarsystemscope_texture_2k_earth_specular_map.jpg';
        const normalUrl = 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Solarsystemscope_texture_2k_earth_normal_map.png/1024px-Solarsystemscope_texture_2k_earth_normal_map.png';

        // Функция безопасной загрузки
        function loadTexture(url, onLoad) {
            textureLoader.load(
                url, 
                (tex) => onLoad(tex), 
                undefined, 
                (err) => console.warn('Ошибка загрузки текстуры (не критично):', url)
            );
        }

        // Применяем текстуры по мере загрузки
        loadTexture(mapUrl, (tex) => {
            material.map = tex;
            material.color.setHex(0x888888); // Делаем базу серой, чтобы карта цвета легла правильно
            material.emissive.setHex(0x000000); // Убираем собственное свечение
            material.needsUpdate = true;
        });

        loadTexture(specUrl, (tex) => {
            material.specularMap = tex;
            material.specular.setHex(0x222222);
            material.needsUpdate = true;
        });

        loadTexture(normalUrl, (tex) => {
            material.normalMap = tex;
            material.needsUpdate = true;
        });

        // --- 4. АТМОСФЕРА ---
        const atmoGeo = new THREE.SphereGeometry(5.2, 64, 64);
        const atmoMat = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 4.5);
                    gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        scene.add(new THREE.Mesh(atmoGeo, atmoMat));

        // --- 5. МАГНИТНЫЕ ВОЛНЫ ---
        // Точки
        const particlesGeo = new THREE.BufferGeometry();
        const count = 1000;
        const positions = new Float32Array(count * 3);
        for(let i=0; i<count*3; i++) positions[i] = (Math.random()-0.5) * 22;
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({ size: 0.08, color: 0x00aaff, transparent: true, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        // Линии (Кольца)
        const rings = [];
        const ringGroup = new THREE.Group();
        scene.add(ringGroup);
        
        const torusMat = new THREE.MeshBasicMaterial({ color: 0x0088ff, transparent: true, opacity: 0.2, wireframe: true });
        for(let i=0; i<5; i++) {
            const torus = new THREE.Mesh(new THREE.TorusGeometry(6 + i*1.2, 0.05, 8, 100), torusMat);
            torus.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            ringGroup.add(torus);
            rings.push(torus);
        }

        // --- 6. СВЕТ ---
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(10, 5, 10);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x050505));
        const blueBackLight = new THREE.PointLight(0x0044ff, 1, 100);
        blueBackLight.position.set(-10, -5, -15);
        scene.add(blueBackLight);

        // --- 7. АНИМАЦИЯ ---
        function animate() {
            requestAnimationFrame(animate);
            
            earthMesh.rotation.y += 0.0015;
            particles.rotation.y -= 0.001;
            
            rings.forEach((r, i) => {
                r.rotation.x += 0.002 * (i%2 ? 1 : -1);
                r.rotation.y += 0.001;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
